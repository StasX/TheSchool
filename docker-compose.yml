services:
  app:
    build:
      context: ./server
      dockerfile: Dockerfile

    ports:
      - "8090:80"

    environment:
      APP_NAME: TheSchool
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8090
      APP_KEY: base64:MiIdtX2yS+VOQaKgFspOHwH/pbCDDhJMWQe3C4WoI/A=

      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_unicode_ci

      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: null
      REDIS_DB: 0
      REDIS_CACHE_DB: 1

      SESSION_DRIVER: database
      SESSION_LIFETIME: 120

      LOG_CHANNEL: stack
      LOG_LEVEL: debug

      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: local

    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - app-network


  mariadb:
    build:
      context: ./sql

    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mariadb-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h localhost -u root -p$$MARIADB_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - app-network


  redis:
    build:
      context: ./redis

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app-network


volumes:
  mariadb-data:
  redis-data:


networks:
  app-network:
