<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Login</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
        <link href="css/style.css" rel="stylesheet">
        <link href="css/bootstrap.css" rel="stylesheet">
        <link href="css/navigation.css" rel="stylesheet">
        <link href="css/sweetalert2.css" rel="stylesheet">
        <link href="css/alerts.css" rel="stylesheet">
        <link href="css/main.css" rel="stylesheet">
        <script src="js/jquery.js"></script>
        <script src="js/jquery.cookie.js"></script>
        <script src="js/sweetalert2.js"></script>
        <script src="js/lib.js"></script>
        <script src="js/core.js"></script>
        <script src="js/sha256.js"></script>
        <script src="js/func.js"></script>
        <script src="js/main.js"></script>
        
        
    </head>
    <body>
        <nav class="navbar navbar-default">
            <div class="container-fluid">
                <div class="navbar-header">
                    <img alt="Logo" src="img/logo.png" class = "img-rounded logo" height = "50" width = "67">
                </div>
            </div>
        </nav>
        <div class="container-fluid">
            <div class="container col-sm-4 col-xs-12 col-sm-offset-4" id="container">
                <div class="row">
                    <img alt="login" src="img/user.png" width="160" height="160" class="rounded user-img" />
                </div>
                <form id="login">
                    <div class="row">
                        <div class="input-group col-sm-10 col-xs-10 col-sm-offset-1 col-xs-offset-1">
                            <label class="input-group-addon" for="user">Username</label>
                            <input type="text" name="user" id="username" class="form-control" placeholder="Username" spellcheck="false" />           
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-group col-sm-10 col-xs-10 col-xs-offset-1 col-xs-offset-1">
                            <label class="input-group-addon" for="pass">Password&nbsp;</label>
                            <input type="password" name="pass" id="password" class="form-control" placeholder="Password" />
                        </div>
                    </div>
                    <div class="container col-sm-10 col-xs-10 col-sm-offset-1 col-xs-ofset-1">
                    </div>
                    <div class="row">
                        <button class="btn btn-md col-sn-2 col-xs-4 col-sm-offset-5 col-xs-offset-3" role="submit">Login</button>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
